[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vtk-index"
version = "1.0.0"
description = "Chunking, embedding, and hybrid retrieval for the VTK knowledge artifact"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Patrick O'Leary"}
]
keywords = ["vtk", "index", "retrieval", "visualization", "search", "qdrant"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Visualization",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

dependencies = [
    "qdrant-client>=1.7.0",
    "sentence-transformers>=2.2.0",
    "fastembed>=0.2.0",
    "pydantic>=2.0.0",
    "vtk-knowledge>=1.0.0",
    "typer>=0.12.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.8.0",
]

[project.urls]
Homepage = "https://github.com/vicentebolea/vtk-index"
Repository = "https://github.com/vicentebolea/vtk-index"
Documentation = "https://github.com/vicentebolea/vtk-index#readme"

[project.scripts]
vtk-index = "vtk_index.pipeline.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/vtk_index"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
pythonpath = ["src"]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]

[tool.coverage.run]
source = ["vtk_index"]
omit = ["tests/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "B",
    "UP",
]
ignore = [
    "E501",
    "B008",
    "B904",
]

[tool.ruff.lint.isort]
known-first-party = ["vtk_index"]
