name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  actionlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run actionlint
        uses: rhysd/actionlint@v1.7.12

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Create virtualenv
        run: uv venv

      - name: Install vtk-knowledge from GitHub
        run: uv pip install "vtk-knowledge @ git+https://github.com/vicentebolea/vtk-knowledge.git"

      - name: Install dev dependencies
        run: uv pip install -e ".[dev]"

      - name: Run ruff check
        run: .venv/bin/ruff check src/ tests/

      - name: Run ruff format check
        run: .venv/bin/ruff format --check src/ tests/

  test:
    needs: [actionlint, lint]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Create virtualenv
        run: uv venv --python ${{ matrix.python-version }}

      - name: Install vtk-knowledge from GitHub
        run: uv pip install "vtk-knowledge @ git+https://github.com/vicentebolea/vtk-knowledge.git"

      - name: Install dev dependencies
        run: uv pip install -e ".[dev]"

      - name: Run tests
        run: .venv/bin/pytest tests/ -v --tb=short
